<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Management | Ocean View Resort</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <header>
        <div class="logo">Ocean View Resort (Admin)</div>
        <nav>
            <a href="dashboard.html" class="btn btn-accent">Dashboard</a>
            <button class="btn" onclick="logout()">Logout</button>
        </nav>
    </header>

    <div class="container">
        <h1>Staff Management</h1>

        <div class="grid">
            <!-- Create User -->
            <div class="card">
                <h3>Add New Staff</h3>
                <form id="userForm">
                    <input type="hidden" name="action" value="create">
                    <div class="form-group">
                        <input type="text" name="username" placeholder="Username" required>
                    </div>
                    <div class="form-group">
                        <input type="password" name="password" placeholder="Password" required>
                    </div>
                    <div class="form-group">
                        <input type="text" name="fullName" placeholder="Full Name" required>
                    </div>
                    <div class="form-group">
                        <select name="role" required>
                            <option value="RECEPTIONIST">Receptionist</option>
                            <option value="ADMIN">Admin</option>
                        </select>
                    </div>
                    <button type="submit" class="btn" style="width: 100%;">Create Account</button>
                </form>
            </div>

            <!-- User List -->
            <div class="card" style="grid-column: span 2;">
                <h3>Current Staff</h3>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Username</th>
                                <th>Role</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="userTableBody">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="statusMsg" class="alert" style="display: none; margin-top: 2rem;"></div>
    </div>

    <script>
        async function logout() {
            await fetch('../logout');
            window.location.href = '../index.html';
        }

        async function loadUsers() {
            try {
                const response = await fetch('users');
                const users = await response.json();
                const tbody = document.getElementById('userTableBody');
                tbody.innerHTML = '';

                users.forEach(user => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${user.fullName}</td>
                        <td>${user.username}</td>
                        <td><span class="status-badge status-available">${user.role}</span></td>
                        <td>
                            <button class="btn alert-error" onclick="deleteUser(${user.id})" ${user.role === 'ADMIN' ? 'disabled' : ''}>Delete</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                console.error('Error loading users:', error);
            }
        }

        async function deleteUser(id) {
            if (!confirm('Are you sure you want to delete this staff member?')) return;

            const formData = new URLSearchParams();
            formData.append('action', 'delete');
            formData.append('id', id);

            try {
                const response = await fetch('users', {
                    method: 'POST',
                    body: formData,
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
                });
                const result = await response.json();
                showStatus(result.message, result.success);
                if (result.success) loadUsers();
            } catch (error) {
                showStatus('Error deleting user', false);
            }
        }

        function showStatus(msg, success) {
            const statusMsg = document.getElementById('statusMsg');
            statusMsg.textContent = msg;
            statusMsg.className = `alert ${success ? 'alert-success' : 'alert-error'}`;
            statusMsg.style.display = 'block';
        }

        document.getElementById('userForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new URLSearchParams(new FormData(e.target));

            try {
                const response = await fetch('users', {
                    method: 'POST',
                    body: formData,
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
                });
                const result = await response.json();
                showStatus(result.message, result.success);
                if (result.success) {
                    e.target.reset();
                    loadUsers();
                }
            } catch (error) {
                showStatus('Error creating user', false);
            }
        });

        loadUsers();
    </script>
</body>

</html>
