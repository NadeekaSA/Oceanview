<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Management | Ocean View Resort</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="layout-wrapper">
        <aside class="sidebar">
            <div class="sidebar-header">Ocean View Resort (Admin)</div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">System Configuration</a>
                <a href="users.html" class="nav-item active">Staff Management</a>
                <a href="reports.html" class="nav-item">System Reports</a>
            </nav>
            <div class="sidebar-footer">
                <button class="btn btn-sm" style="width:100%" onclick="logout()">Logout</button>
            </div>
        </aside>

        <main class="main-content">
            <div class="top-bar">
                <h2 id="viewTitle">Staff Management</h2>
                <div class="user-info">Logged in as: <strong>Administrator</strong></div>
            </div>

            <div class="grid">
                <!-- Create User -->
                <div class="card">
                    <h3>Add New Staff Member</h3>
                    <p style="margin-bottom: 1.5rem; color: #666;">Create credentials for receptionists or secondary
                        administrators.</p>
                    <form id="userForm">
                        <input type="hidden" name="action" value="create">
                        <div class="form-group">
                            <label>Full Name</label>
                            <input type="text" name="fullName" placeholder="e.g. John Doe" required>
                        </div>
                        <div class="form-group">
                            <label>Username</label>
                            <input type="text" name="username" placeholder="e.g. jdoe" required>
                        </div>
                        <div class="form-group">
                            <label>Password</label>
                            <input type="password" name="password" placeholder="••••••••" required>
                        </div>
                        <div class="form-group">
                            <label>Role</label>
                            <select name="role" required>
                                <option value="RECEPTIONIST">Receptionist</option>
                                <option value="ADMIN">Administrator</option>
                            </select>
                        </div>
                        <button type="submit" class="btn" style="width: 100%;">Create Account</button>
                    </form>
                </div>

                <!-- User List -->
                <div class="card" style="grid-column: span 2;">
                    <h3>Current Staff Accounts</h3>
                    <div id="statusMsg" class="alert" style="display: none; margin-bottom: 1.5rem;"></div>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Username</th>
                                    <th>Role</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="userTableBody">
                                <!-- Populated by JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        async function logout() {
            await fetch('../logout');
            window.location.href = '../index.html';
        }

        async function loadUsers() {
            try {
                const response = await fetch('users');
                const users = await response.json();
                const tbody = document.getElementById('userTableBody');
                tbody.innerHTML = '';

                users.forEach(user => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><strong>${user.fullName}</strong></td>
                        <td>${user.username}</td>
                        <td><span class="status-badge status-available">${user.role}</span></td>
                        <td>
                            <button class="btn alert-error btn-sm" onclick="deleteUser(${user.id})" ${user.role === 'ADMIN' ? 'disabled title="Cannot delete admin"' : ''}>Delete</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                console.error('Error loading users:', error);
            }
        }

        async function deleteUser(id) {
            if (!confirm('Are you sure you want to delete this staff member?')) return;

            const formData = new URLSearchParams();
            formData.append('action', 'delete');
            formData.append('id', id);

            try {
                const response = await fetch('users', {
                    method: 'POST',
                    body: formData,
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
                });
                const result = await response.json();
                showStatus(result.message, result.success);
                if (result.success) loadUsers();
            } catch (error) {
                showStatus('Error deleting user', false);
            }
        }

        function showStatus(msg, success) {
            const statusMsg = document.getElementById('statusMsg');
            statusMsg.textContent = msg;
            statusMsg.className = `alert ${success ? 'alert-success' : 'alert-error'}`;
            statusMsg.style.display = 'block';
            setTimeout(() => { statusMsg.style.display = 'none'; }, 5000);
        }

        document.getElementById('userForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new URLSearchParams(new FormData(e.target));

            try {
                const response = await fetch('users', {
                    method: 'POST',
                    body: formData,
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
                });
                const result = await response.json();
                showStatus(result.message, result.success);
                if (result.success) {
                    e.target.reset();
                    loadUsers();
                }
            } catch (error) {
                showStatus('Error creating user', false);
            }
        });

        loadUsers();
        initHelp('admin');
    </script>
</body>

</html>
