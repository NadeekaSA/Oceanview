<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Ocean View Resort</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <header>
        <div class="logo">Ocean View Resort (Admin)</div>
        <nav>
            <button class="btn btn-accent" onclick="logout()">Logout</button>
        </nav>
    </header>

    <div class="container">
        <h1>System Configuration & Management</h1>

        <div class="grid">
            <!-- Room Rate Config -->
            <div class="card">
                <h3>Update Room Rates</h3>
                <form id="rateForm">
                    <input type="hidden" name="action" value="updateRate">
                    <div class="form-group">
                        <select name="roomNumber" id="rateRoomSelect" required>
                            <option value="">Loading rooms...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <input type="number" step="0.01" name="rate" placeholder="New Nightly Rate" required>
                    </div>
                    <button type="submit" class="btn" style="width: 100%;">Update Rate</button>
                </form>
            </div>

            <!-- Add New Room -->
            <div class="card">
                <h3>Add New Room</h3>
                <form id="addRoomForm">
                    <input type="hidden" name="action" value="add">
                    <div class="form-group">
                        <input type="text" name="roomNumber" placeholder="Room Number (e.g. 301)" required>
                    </div>
                    <div class="form-group">
                        <select name="type" required>
                            <option value="SINGLE">Single</option>
                            <option value="DOUBLE">Double</option>
                            <option value="SUITE">Suite</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <input type="number" step="0.01" name="rate" placeholder="Default Rate" required>
                    </div>
                    <button type="submit" class="btn btn-accent" style="width: 100%;">Create Room</button>
                </form>
            </div>
        </div>

        <div class="card" style="margin-top: 2rem;">
            <h3>Quick Links</h3>
            <div style="display: flex; gap: 1rem;">
                <a href="reports.html" class="btn" style="flex: 1; text-align: center;">View Occupancy Report</a>
                <a href="users.html" class="btn btn-accent" style="flex: 1; text-align: center;">Manage Staff
                    Accounts</a>
            </div>
        </div>

        <div id="statusMsg" class="alert" style="display: none; margin-top: 2rem;"></div>
    </div>

    <script>
        async function logout() {
            await fetch('../logout');
            window.location.href = '../index.html';
        }

        async function loadRooms() {
            try {
                const resp = await fetch('../room');
                const rooms = await resp.json();
                const select = document.getElementById('rateRoomSelect');
                select.innerHTML = '<option value="">Select Room</option>';
                rooms.forEach(r => {
                    const opt = document.createElement('option');
                    opt.value = r.roomNumber;
                    opt.textContent = `Room ${r.roomNumber} (${r.type})`;
                    select.appendChild(opt);
                });
            } catch (err) { console.error(err); }
        }

        async function handleForm(formId) {
            document.getElementById(formId).addEventListener('submit', async (e) => {
                e.preventDefault();
                const formData = new URLSearchParams(new FormData(e.target));
                const statusMsg = document.getElementById('statusMsg');

                try {
                    const response = await fetch('../room', {
                        method: 'POST',
                        body: formData,
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
                    });
                    const result = await response.json();
                    statusMsg.textContent = result.message;
                    statusMsg.className = `alert alert-${result.success ? 'success' : 'error'}`;
                    statusMsg.style.display = 'block';
                    if (result.success) {
                        e.target.reset();
                        loadRooms();
                    }
                } catch (error) {
                    statusMsg.textContent = 'Server communication error';
                    statusMsg.className = 'alert alert-error';
                    statusMsg.style.display = 'block';
                }
            });
        }

        loadRooms();
        handleForm('rateForm');
        handleForm('addRoomForm');
    </script>
</body>

</html>
