<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receptionist Dashboard | Ocean View Resort</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <header>
        <div class="logo">Ocean View Resort</div>
        <nav>
            <button class="btn btn-accent" onclick="logout()">Logout</button>
        </nav>
    </header>

    <div class="container text-center">
        <h1 style="margin-bottom: 2rem;">Receptionist Dashboard</h1>

        <div class="grid">
            <!-- Guest Registration -->
            <div class="card">
                <h3>Register New Guest</h3>
                <form id="guestForm">
                    <input type="hidden" name="action" value="register">
                    <div class="form-group">
                        <input type="text" name="name" placeholder="Full Name" required>
                    </div>
                    <div class="form-group">
                        <input type="text" name="address" placeholder="Address" required>
                    </div>
                    <div class="form-group">
                        <input type="text" name="contact" placeholder="Contact Number" required>
                    </div>
                    <div class="form-group">
                        <input type="email" name="email" placeholder="Email Address" required>
                    </div>
                    <div class="form-group">
                        <input type="text" name="idCard" placeholder="ID Card Number" required>
                    </div>
                    <button type="submit" class="btn" style="width: 100%;">Register Guest</button>
                </form>
            </div>

            <!-- Room Booking -->
            <div class="card">
                <h3>New Reservation</h3>
                <form id="resForm">
                    <input type="hidden" name="action" value="book">
                    <div class="form-group">
                        <input type="number" name="guestId" placeholder="Guest ID" required>
                    </div>
                    <div class="form-group">
                        <select name="roomNumber" required>
                            <option value="">Select Room</option>
                            <option value="101">101 - Single</option>
                            <option value="102">102 - Double</option>
                            <option value="201">201 - Suite</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Check-in Date</label>
                        <input type="date" name="checkIn" required>
                    </div>
                    <div class="form-group">
                        <label>Check-out Date</label>
                        <input type="date" name="checkOut" required>
                    </div>
                    <button type="submit" class="btn btn-accent" style="width: 100%;">Create Booking</button>
                </form>
            </div>
        </div>

        <!-- Guest List -->
        <div class="card" style="margin-top: 2rem;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                <h3 style="margin: 0;">Recent Guests</h3>
                <div style="display: flex; gap: 0.5rem;">
                    <input type="text" id="searchInput" placeholder="Search by name or ID card..."
                        style="padding: 0.5rem; border-radius: 4px; border: 1px solid #ddd; width: 250px;">
                    <button class="btn btn-sm" onclick="searchGuests()">Search</button>
                    <button class="btn btn-sm btn-accent" onclick="loadGuests()">Reset</button>
                </div>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Contact</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="guestTableBody">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>
        </div>

        <div id="statusMsg" class="alert" style="display: none; margin-top: 2rem;"></div>
    </div>

    <script>
        async function logout() {
            await fetch('../logout');
            window.location.href = '../index.html';
        }

        async function loadGuests() {
            document.getElementById('searchInput').value = '';
            try {
                const response = await fetch('../guest');
                const guests = await response.json();
                renderGuests(guests);
            } catch (error) {
                console.error('Error loading guests:', error);
            }
        }

        async function searchGuests() {
            const query = document.getElementById('searchInput').value;
            if (!query) return;
            try {
                const response = await fetch(`../guest?query=${encodeURIComponent(query)}`);
                const guests = await response.json();
                renderGuests(guests);
            } catch (error) {
                console.error('Error searching guests:', error);
            }
        }

        function renderGuests(guests) {
            const tbody = document.getElementById('guestTableBody');
            tbody.innerHTML = '';
            guests.forEach(guest => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>#${guest.id}</td>
                    <td>${guest.name}</td>
                    <td>${guest.email}</td>
                    <td>${guest.contact}</td>
                    <td>
                        <button class="btn btn-accent btn-sm" onclick="viewGuest(${guest.id})">View Details</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function viewGuest(id) {
            window.open(`guest_view.html?id=${id}`, '_blank');
        }

        async function handleForm(formId, url) {
            document.getElementById(formId).addEventListener('submit', async (e) => {
                e.preventDefault();
                const formData = new URLSearchParams(new FormData(e.target));
                const statusMsg = document.getElementById('statusMsg');

                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        body: formData,
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
                    });
                    const result = await response.json();

                    statusMsg.textContent = result.message || (result.success ? "Operation Successful" : "Operation Failed");
                    statusMsg.className = `alert ${result.success ? 'alert-success' : 'alert-error'}`;
                    statusMsg.style.display = 'block';
                    if (result.success) {
                        e.target.reset();
                        loadGuests(); // Refresh list on new registration
                    }
                } catch (error) {
                    statusMsg.textContent = 'Connection Error';
                    statusMsg.className = 'alert alert-error';
                    statusMsg.style.display = 'block';
                }
            });
        }

        handleForm('guestForm', '../guest');
        handleForm('resForm', '../reservation');
        loadGuests();
    </script>
</body>

</html>
