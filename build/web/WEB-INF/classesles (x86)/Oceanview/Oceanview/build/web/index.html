<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Ocean View Resort</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-page">
    <div class="login-glass-card">
        <h2>Ocean View Resort</h2>
        <p style="text-align: center; color: rgba(255,255,255,0.7); margin-bottom: 2.5rem; font-weight: 500;">Internal
            Staff Portal</p>

        <div id="alertBox" class="alert alert-error"
            style="display: none; background: rgba(250, 82, 82, 0.2); border: 1px solid rgba(250, 82, 82, 0.3); color: #fff;">
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn" style="width: 100%;">Sign In</button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const originalText = btn.textContent;
            btn.textContent = 'Authenticating...';
            btn.disabled = true;

            const formData = new URLSearchParams(new FormData(e.target));
            const alertBox = document.getElementById('alertBox');

            try {
                const response = await fetch('login', {
                    method: 'POST',
                    body: formData,
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
                });

                const result = await response.json();
                if (result.success) {
                    window.location.href = result.role === 'ADMIN' ? 'admin/dashboard.html' : 'receptionist/dashboard.html';
                } else {
                    alertBox.textContent = result.message;
                    alertBox.style.display = 'block';
                    btn.textContent = originalText;
                    btn.disabled = false;
                }
            } catch (error) {
                alertBox.textContent = 'Server connection failed';
                alertBox.style.display = 'block';
                btn.textContent = originalText;
                btn.disabled = false;
            }
        });
    </script>
</body>

</html>
