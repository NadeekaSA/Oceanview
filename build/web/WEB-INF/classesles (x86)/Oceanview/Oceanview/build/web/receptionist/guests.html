<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guest Management | Lucky Resort</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="layout-wrapper">
        <aside class="sidebar">
            <div class="sidebar-header">Lucky Resort</div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">Dashboard Overview</a>
                <a href="guests.html" class="nav-item active">Guest Management</a>
                <a href="rooms.html" class="nav-item">Room Status</a>
                <a href="reservations.html" class="nav-item">Reservations</a>
            </nav>
            <div class="sidebar-footer">
                <button class="btn btn-sm" style="width:100%" onclick="logout()">Logout</button>
            </div>
        </aside>

        <main class="main-content">
            <div class="top-bar">
                <h2>Guest Management</h2>
                <button class="btn btn-sm btn-accent" onclick="showModal()">+ Register Guest</button>
            </div>

            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                    <h3>All Guests</h3>
                    <div style="display: flex; gap: 0.5rem;">
                        <input type="text" id="searchInput" placeholder="Search by name or ID card..."
                            style="width: 300px;">
                        <button class="btn btn-sm" onclick="searchGuests()">Search</button>
                        <button class="btn btn-sm btn-accent" onclick="loadGuests()">Reset</button>
                    </div>
                </div>

                <div id="statusMsg" class="alert" style="display: none;"></div>

                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>ID/Passport</th>
                                <th>Email</th>
                                <th>Contact</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="guestTableBody">
                            <tr>
                                <td colspan="6" style="text-align: center; padding: 2rem;">Loading guests...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Registration/Edit Modal -->
    <div id="regModal"
        style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;">
        <div class="card" style="width: 500px; position: relative;">
            <button onclick="hideModal()"
                style="position: absolute; right: 2rem; top: 2rem; border: none; background: none; cursor: pointer; font-size: 1.5rem;">&times;</button>
            <h3 id="modalTitle">Register New Guest</h3>
            <form id="guestForm">
                <input type="hidden" name="action" id="formAction" value="register">
                <input type="hidden" name="id" id="guestId">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" name="name" id="guestName" required>
                </div>
                <div class="grid" style="grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label>ID/Passport #</label>
                        <input type="text" name="idCard" id="guestIdCard" required>
                    </div>
                    <div class="form-group">
                        <label>Phone</label>
                        <input type="text" name="contact" id="guestContact" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" id="guestEmail" required>
                </div>
                <div class="form-group">
                    <label>Address</label>
                    <textarea name="address" id="guestAddress" rows="2" required></textarea>
                </div>
                <button type="submit" class="btn" style="width: 100%;" id="submitBtn">Complete Registration</button>
            </form>
        </div>
    </div>

    <script>
        function showModal(isEdit = false, guest = null) {
            const modal = document.getElementById('regModal');
            const title = document.getElementById('modalTitle');
            const action = document.getElementById('formAction');
            const submitBtn = document.getElementById('submitBtn');
            const idInput = document.getElementById('guestId');

            if (isEdit && guest) {
                title.textContent = 'Edit Guest Details';
                action.value = 'update';
                submitBtn.textContent = 'Save Changes';
                idInput.value = guest.id;
                document.getElementById('guestName').value = guest.name;
                document.getElementById('guestIdCard').value = guest.idCardNumber;
                document.getElementById('guestContact').value = guest.contact;
                document.getElementById('guestEmail').value = guest.email;
                document.getElementById('guestAddress').value = guest.address;
            } else {
                title.textContent = 'Register New Guest';
                action.value = 'register';
                submitBtn.textContent = 'Complete Registration';
                idInput.value = '';
                document.getElementById('guestForm').reset();
            }
            modal.style.display = 'flex';
        }

        function hideModal() { document.getElementById('regModal').style.display = 'none'; }
    </script>
    <script src="../js/help_manager.js"></script>
    <script>
        let allGuests = [];

        async function logout() {
            await fetch('../logout');
            window.location.href = '../index.html';
        }

        async function loadGuests() {
            document.getElementById('searchInput').value = '';
            try {
                const response = await fetch('../guest');
                allGuests = await response.json();
                renderGuests(allGuests);
            } catch (error) { console.error(error); }
        }

        async function searchGuests() {
            const query = document.getElementById('searchInput').value;
            if (!query) return;
            try {
                const response = await fetch(`../guest?query=${encodeURIComponent(query)}`);
                const data = await response.json();
                renderGuests(data);
            } catch (error) { console.error(error); }
        }

        function renderGuests(guests) {
            const tbody = document.getElementById('guestTableBody');
            tbody.innerHTML = guests.length === 0 ? '<tr><td colspan="6" style="text-align: center; padding: 2rem;">No guests found.</td></tr>' : '';
            guests.forEach(guest => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>#${guest.id}</td>
                    <td>${guest.name}</td>
                    <td>${guest.idCardNumber || '-'}</td>
                    <td>${guest.email}</td>
                    <td>${guest.contact}</td>
                    <td style="display: flex; gap: 0.5rem;">
                        <button class="btn btn-sm" onclick='prepareEdit(${JSON.stringify(guest).replace(/'/g, "&apos;")})'>Edit</button>
                        <button class="btn btn-accent btn-sm" onclick="deleteGuest(${guest.id})">Delete</button>
                        <button class="btn btn-sm" style="background: #666;" onclick="window.open('guest_view.html?id=${guest.id}', '_blank')">View</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function prepareEdit(guest) {
            showModal(true, guest);
        }

        async function deleteGuest(id) {
            if (!confirm('Are you sure you want to delete this guest? This action cannot be undone.')) return;
            try {
                const response = await fetch('../guest', {
                    method: 'POST',
                    body: new URLSearchParams({ action: 'delete', id: id }),
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
                });
                const result = await response.json();
                if (result.success) {
                    loadGuests();
                } else {
                    alert(result.message);
                }
            } catch (error) { alert('Error deleting guest'); }
        }

        document.getElementById('guestForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new URLSearchParams(new FormData(e.target));
            try {
                const response = await fetch('../guest', {
                    method: 'POST',
                    body: formData,
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
                });
                const result = await response.json();
                if (result.success) {
                    hideModal();
                    alert(result.message);
                    loadGuests();
                } else {
                    alert(result.message);
                }
            } catch (error) { alert('Error processing request'); }
        });

        loadGuests();
        initHelp('guests');
    </script>
</body>

</html>
