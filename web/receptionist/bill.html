<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guest Bill | Ocean View Resort</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body {
            background: white;
            padding: 3rem;
        }

        .bill-container {
            max-width: 800px;
            margin: 0 auto;
            border: 1px solid #ddd;
            padding: 3rem;
            box-shadow: none;
        }

        .bill-header {
            display: flex;
            justify-content: space-between;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 1rem;
            margin-bottom: 2rem;
        }

        .bill-to {
            margin-bottom: 2rem;
        }

        .bill-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 2rem;
        }

        .bill-table th,
        .bill-table td {
            border: 1px solid #ddd;
            padding: 1rem;
            text-align: left;
        }

        .bill-table th {
            background: #f9f9f9;
        }

        .total-row {
            font-size: 1.5rem;
            font-weight: bold;
            text-align: right;
        }

        @media print {
            .no-print {
                display: none;
            }

            body {
                padding: 0;
            }

            .bill-container {
                border: none;
            }
        }
    </style>
</head>

<body>
    <div class="no-print" style="text-align: right; margin-bottom: 1rem;">
        <button class="btn" onclick="window.print()">Print Bill</button>
        <button class="btn btn-accent" onclick="window.close()">Close</button>
    </div>

    <div class="bill-container">
        <div class="bill-header">
            <div>
                <h1>Ocean View Resort</h1>
                <p>123 Beachfront Avenue, Tropical Bay</p>
                <p>Tel: +1 234 567 890</p>
            </div>
            <div style="text-align: right;">
                <h2 style="color: var(--primary);">INVOICE</h2>
                <p><strong>Reservation #:</strong> <span id="billResNo">--</span></p>
                <p><strong>Date:</strong> <span id="billDate">--</span></p>
            </div>
        </div>

        <div class="bill-to">
            <h3>Bill To:</h3>
            <p><strong id="billGuestName">--</strong></p>
            <p id="billGuestEmail">--</p>
            <p id="billGuestPhone">--</p>
        </div>

        <table class="bill-table">
            <thead>
                <tr>
                    <th>Description</th>
                    <th>Dates</th>
                    <th>Nights</th>
                    <th>Total</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Room Accommodation - Room <span id="billRoomNo">--</span></td>
                    <td><span id="billStay">--</span></td>
                    <td id="billNights">--</td>
                    <td id="billTotalAmount">--</td>
                </tr>
            </tbody>
        </table>

        <div class="total-row">
            Grand Total: <span id="billGrandTotal" style="color: var(--primary);">--</span>
        </div>

        <div style="margin-top: 4rem; text-align: center; color: #666;">
            <p>Thank you for staying with us!</p>
            <small>This is a computer-generated invoice.</small>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const resNo = urlParams.get('resNo');

        async function loadBill() {
            if (!resNo) return;
            document.getElementById('billDate').textContent = new Date().toLocaleDateString();

            try {
                // Get Reservation Details
                const resResp = await fetch(`../reservation?action=get&resNo=${resNo}`);
                const res = await resResp.json();

                // Get Guest Details
                const guestResp = await fetch(`../guest?id=${res.guestId}`);
                const guest = await guestResp.json();

                document.getElementById('billResNo').textContent = res.reservationNumber;
                document.getElementById('billRoomNo').textContent = res.roomNumber;
                document.getElementById('billStay').textContent = `${res.checkInDate} to ${res.checkOutDate}`;

                const d1 = new Date(res.checkInDate);
                const d2 = new Date(res.checkOutDate);
                const nights = Math.ceil(Math.abs(d2 - d1) / (1000 * 60 * 60 * 24)) || 1;
                document.getElementById('billNights').textContent = nights;

                const total = res.totalCost.toFixed(2);
                document.getElementById('billTotalAmount').textContent = `$${total}`;
                document.getElementById('billGrandTotal').textContent = `$${total}`;

                document.getElementById('billGuestName').textContent = guest.name;
                document.getElementById('billGuestEmail').textContent = guest.email;
                document.getElementById('billGuestPhone').textContent = guest.contact;

            } catch (error) {
                console.error('Error loading bill:', error);
                alert('Failed to load bill details.');
            }
        }

        loadBill();
    </script>
</body>

</html>
